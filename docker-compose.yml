# ============================================================
# Docker Manager Go — 面板 Docker Compose 部署
# 默认配置开箱即用;可选功能已注释,按需取消注释启用
# 取消注释:编辑器里选中多行按 Ctrl+/ 即可(缩进已按 YAML 层级排好)
# ============================================================
services:
  dockorae:
    image: dockorae/dockorae:latest
    container_name: dockorae
    restart: unless-stopped

    # ---- 端口映射 ----
    # 默认 HTTP 访问: http://<服务器IP>:8080
    ports:
      - "8080:8080"
      # HTTPS 域名绑定后(面板 设置 → 常规 → 证书):
      #   注释掉上面的 8080 一行,启用下面这行,即可 https://域名 直访(无需端口号)
      # - "443:8080"
      # 仅本机访问(不对外暴露,面板自己走反向代理时用):
      # - "127.0.0.1:8080:8080"

    # ---- 环境变量 ----
    environment:
      - DATA_DIR=/data          # 面板数据目录(SQLite 数据库、设置、用户、应用商店数据)
      - PORT=8080               # 面板监听端口
      - TZ=Asia/Shanghai        # 容器时区

    # ---- 数据卷 ----
    volumes:
      # 面板数据(数据库、设置、用户、应用商店数据)
      - ./data:/data
      # HTTPS 证书目录(域名绑定后把 fullchain.pem / privkey.pem 放这里)
      - ./cert:/data/cert:ro
      # Agent 共享目录(socket + token):与 dockorae-agent 容器共用
      - /run/dockorae:/run/dockorae

    # ---- 可选功能(按需取消注释) ----

    # ---- 安全加固 ----
    # 面板不挂载 docker.sock、不访问宿主文件系统(Docker/宿主操作全部经 Agent),
    # 以下加固可直接启用:
    # 禁用容器内写文件系统(面板数据仍走卷),降低入侵后写入风险
    # read_only: true
    # 删除默认能力 + 禁止提权
    # cap_drop:
      # - ALL
    # security_opt:
      # - no-new-privileges:true

    # ---- 资源限制 ----
    # CPU/内存上限(按服务器规格调整)
    # mem_limit: 1g
    # cpus: "2.0"
    # 进程数上限(防 fork 炸弹)
    # pids_limit: 512

    # ---- 容器日志限制(防止日志撑爆磁盘) ----
    # logging:
      # driver: json-file
      # options:
        # max-size: "10m"
        # max-file: "3"

    # ---- 健康检查(面板存活探针,镜像内置 curl) ----
    # healthcheck:
      # test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/system/public-config"]
      # interval: 30s
      # timeout: 5s
      # retries: 3
      # start_period: 10s

    # ---- 生命周期 ----
    # 停止/重启时给面板的优雅退出时间(默认 10s;数据量大或正执行任务时调大)
    # stop_grace_period: 30s

    # ---- 自定义网络(固定容器 IP / 与其它服务互通) ----
    # 两种方案二选一(取消注释其一即可,同时启用会互相覆盖):
    # 方案 A:固定 IP(需该网络已存在)
    # networks:
      # dm-net:
        # ipv4_address: 172.20.0.10
    # 方案 B:自建 bridge 网络
    # networks:
      # dm-net:
        # driver: bridge
        # ipam:
          # config:
            # - subnet: 172.20.0.0/24

  # ---- DockOrae-Agent 宿主机控制平面(§46:Agent 操作真实宿主) ----
  # 必须:privileged + pid:host(经 nsenter -t 1 进入宿主命名空间)
  # 共享卷 /run/dockorae:面板生成 token 写入 agent.token,Agent 启动时读取
  dockorae-agent:
    image: dockorae/dockorae-agent:latest
    container_name: dockorae-agent
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      # 共享 socket + token 目录(与面板容器共用)
      - /run/dockorae:/run/dockorae
      # Agent 自身容器内 Docker 操作(状态/清理);compose 操作经 nsenter 走宿主 docker CLI
      - /var/run/docker.sock:/var/run/docker.sock
      # Agent 状态数据卷(更新记录/审计)
      - agent-data:/var/lib/dockorae-agent
    environment:
      - TZ=Asia/Shanghai
      - AGENT_SOCKET=/run/dockorae/agent.sock
      - AGENT_TOKEN_FILE=/run/dockorae/agent.token
      - AGENT_DATA_DIR=/var/lib/dockorae-agent
      - AGENT_LOG_DIR=/var/log/dockorae
      # 宿主 compose 文件目录(面板在线更新 + Agent 自身更新定位 compose 用;
      # 非默认安装目录 /opt/docker-manager 时必须设置)
      # - AGENT_COMPOSE_DIR=/opt/docker-manager
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================
# 附加服务(可选,按需取消注释整段)
# ============================================================
volumes:
  agent-data:

# ---- Watchtower:面板容器镜像自动更新(默认每天 03:00 检查) ----
# 注意:面板自身有「在线更新」功能(设置 → 更新),二选一即可;
#       watchtower 还会顺带更新它自己所在 compose 栈的其它容器,确认无误再启用
# watchtower:
  # image: containrrr/watchtower
  # container_name: watchtower
  # restart: unless-stopped
  # volumes:
    # - /var/run/docker.sock:/var/run/docker.sock
  # environment:
    # - TZ=Asia/Shanghai
    # - WATCHTOWER_CLEANUP=true          # 更新后清理旧镜像
    # - WATCHTOWER_SCHEDULE=0 0 3 * * *  # cron:每天 03:00
    # 只更新面板容器(避免动到其它服务)时,再取消下一行:
    # # - WATCHTOWER_SCOPE=dm
  # 配合上面的 scope:给面板容器打上标签
  # (在 dockorae 服务下加 labels: - com.centurylinklabs.watchtower.scope=dm)

# ---- 定时备份(宿主机 cron 示例:每天 02:00 打包面板数据) ----
# 在宿主机 crontab 添加(路径按实际修改):
#   0 2 * * * tar -czf /backup/dm-$(date +\%F).tar.gz -C /path/to/compose/data . && \
#            find /backup -name 'dm-*.tar.gz' -mtime +7 -delete
# 说明:./data 目录即面板全部数据(数据库/设置/用户/应用商店/已装应用编排),停面板备份更稳:
#   docker compose stop && tar ... && docker compose start
