name: Release Docker Manager Go

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      # 单一平台故障不取消其他六个
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
          - armv7
          - armv6
          - 386
          - armv5
          - s390x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # 前端 dist 必须在 go build 之前构建 —— web.go 的 //go:embed all:dist
      # 编译期要求 web/dist/ 存在;dist 已 gitignore,CI 全新检出时为空
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend bundle
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # 纯 Go 项目(modernc sqlite 无 cgo),CGO_ENABLED=0 原生交叉编译,
      # 不需要交叉工具链;armv5/6/7 通过 GOARM 区分
      - name: Build binary
        run: |
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          case "${{ matrix.platform }}" in
            armv7) export GOARCH=arm GOARM=7 ;;
            armv6) export GOARCH=arm GOARM=6 ;;
            armv5) export GOARCH=arm GOARM=5 ;;
          esac
          go build -trimpath -ldflags="-s -w" -o docker-manager-go .
          file docker-manager-go

      - name: Package
        run: |
          mkdir docker-manager-go
          cp docker-manager-go docker-manager-go/
          cp README.md docker-manager-go/ 2>/dev/null || true
          tar -zcvf docker-manager-go-linux-${{ matrix.platform }}.tar.gz docker-manager-go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-manager-go-linux-${{ matrix.platform }}
          path: ./docker-manager-go-linux-${{ matrix.platform }}.tar.gz

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: docker-manager-go-linux-${{ matrix.platform }}.tar.gz
