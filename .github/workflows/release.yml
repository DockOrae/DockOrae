name: Release Docker Manager Go

on:
  # 打 v* tag 即触发发布(版本号取 tag,无需修改源码)
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      branch:
        description: '指定发布的版本号(如 v1.0.3)'
        required: false
        default: ''
      info:
        description: '发布 Release 的补充说明'
        required: false
        default: ''
      force:
        description: '强制构建发布'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.getversion.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 获取版本号
        id: getversion
        run: |
          # push tags 触发时取 tag 名(v1.0.3);手动触发时取输入的版本号
          if [[ -n "${{ github.event.inputs.branch }}" ]]; then
            TAG="${{ github.event.inputs.branch }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "发布版本: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: 删除流程记录
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 0

  build:
    needs: check
    # tag 推送必发;手动触发需 force 或指定版本号
    if: ${{ github.event_name == 'push' || github.event.inputs.force == 'true' || github.event.inputs.branch != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置版本号
        run: |
          echo "TAG=${{ needs.check.outputs.tag }}" >> "$GITHUB_ENV"
          echo "build_time=$(date '+%Y年%m月%d日%H:%M:%S')" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # 前端已独立到 DockOrae/DockOrae-Frontend 仓库:
      # make cross 内部会先下载前端 rolling release 的 dist → public/dist(go:embed),
      # 再做 7 架构交叉编译 + tar 打包,并把 VERSION 通过 ldflags 注入。
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 构建全部架构 (make cross)
        run: make cross VERSION=${{ needs.check.outputs.tag }}

      - name: 发布 Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body: |
            > ### ![](https://img.shields.io/badge/编译时间-${{ env.build_time }}-8267?logo=github&labelColor=需)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.TAG }}/total?label=下载次数&logo=github)

            ${{ github.event.inputs.info }}
