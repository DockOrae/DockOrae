name: Docker Hub Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: zhaoweiwen123/docker-manager-go

jobs:
  build-push:
    # 仅源码改动触发构建(镜像推送);git tag 是二进制发布用的(release.yml),不参与镜像构建。
    # 不用 on.push.paths —— 保持 if 判断源码改动即可;workflow_dispatch 无条件构建。
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.modified, ' ') || '', '.go') ||
      contains(join(github.event.commits.*.added, ' ') || '', '.go') ||
      contains(join(github.event.commits.*.modified, ' ') || '', 'web/') ||
      contains(join(github.event.commits.*.added, ' ') || '', 'web/') ||
      contains(join(github.event.commits.*.modified, ' ') || '', 'Dockerfile') ||
      contains(join(github.event.commits.*.added, ' ') || '', 'Dockerfile')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version (main.go Version)
        id: ver
        run: |
          VER=$(grep -oE 'const Version = "[^"]+"' cmd/docker-manager/main.go | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          case "$VER" in
            v*) V="$VER" ;;
            "") V="" ;;
            *) V="v$VER" ;;
          esac
          echo "version=$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/s390x
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ steps.ver.outputs.version && format('{0}:{1}', env.IMAGE, steps.ver.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-description:
    # 更新 Docker Hub 仓库说明(overview):源码/说明文件改动均触发;
    # 说明文件改动只跑本 job,不触发镜像构建。
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.modified, ' ') || '', '.go') ||
      contains(join(github.event.commits.*.added, ' ') || '', '.go') ||
      contains(join(github.event.commits.*.modified, ' ') || '', 'web/') ||
      contains(join(github.event.commits.*.added, ' ') || '', 'web/') ||
      contains(join(github.event.commits.*.modified, ' ') || '', 'Dockerfile') ||
      contains(join(github.event.commits.*.added, ' ') || '', 'Dockerfile') ||
      contains(join(github.event.commits.*.modified, ' ') || '', 'dockerhub-description.md') ||
      contains(join(github.event.commits.*.added, ' ') || '', 'dockerhub-description.md')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Docker Hub overview (full_description)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Docker Hub API: PATCH /v2/repositories/{namespace}/{name}/ {full_description}
          # 认证:先登录换 JWT(密码或 PAT 均可),再带 Authorization: JWT 调用
          jq -n --rawfile d .github/release/dockerhub-description.md '{full_description: $d}' > /tmp/desc.json
          jwt=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" | jq -r .token)
          [ -z "$jwt" ] || [ "$jwt" = "null" ] && { echo "::error::Docker Hub 登录失败,请检查 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN"; exit 1; }
          code=$(curl -sS -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: JWT ${jwt}" \
            --data-binary @/tmp/desc.json \
            -o /tmp/resp.json \
            -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${IMAGE}/")
          echo "HTTP $code"
          cat /tmp/resp.json
          echo
          test "$code" = "200" || { echo "::error::Docker Hub 说明更新失败(HTTP $code),请检查凭据权限"; exit 1; }
