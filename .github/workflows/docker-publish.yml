name: Docker Hub Publish

on:
  push:
    branches: [master]
    tags: ["v*"]
    # 仅源码改动触发构建;工作流文件/README/.gitignore 等修改不触发
    # (paths 过滤对 tag push 不生效,发版仍然必定触发)
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "Dockerfile"
  workflow_dispatch:

env:
  IMAGE: zhaoweiwen123/docker-manager-go

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/s390x
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}', env.IMAGE, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
