name: Docker Hub Publish

on:
  push:
    branches: [master]
    # 仅源码/前端/Dockerfile/描述文件改动触发;README 等工作流无关改动不触发
    paths:
      - '**.go'
      - 'web/**'
      - 'Dockerfile'
      - '.github/release/dockerhub-description.md'
  workflow_dispatch:

env:
  IMAGE: dockorae/dockorae

jobs:
  build-push:
    # git tag 是二进制发布用的(release.yml),不参与镜像构建。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version (git tag)
        id: ver
        run: |
          # 镜像 version tag 取最近 Git tag(v1.0.3);无 tag 时只发 latest
          V=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "version=$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 前端已独立到 DockOrae/DockOrae-Frontend:下载其 rolling release 的 dist
      # 资产到 public/dist(带 GITHUB_TOKEN 认证避免 API 限流),Dockerfile COPY 嵌入。
      - name: Download frontend dist
        run: |
          URL=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/DockOrae/DockOrae-Frontend/releases/tags/rolling \
            | jq -r '.assets[] | select(.name | startswith("dockorae-frontend-dist-") and endswith(".tar.gz")) | .browser_download_url' | head -1)
          [ -n "$URL" ] || { echo "::error::未找到前端 dist 资产(rolling release 未发布?)"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "$URL" -o /tmp/fe.tar.gz
          rm -rf public/dist && mkdir -p public/dist
          tar -xzf /tmp/fe.tar.gz -C public/dist
          rm -f /tmp/fe.tar.gz
          echo "前端 dist 就绪: $(ls public/dist | head -3 | tr '\n' ' ')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/s390x
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.ver.outputs.build_time }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ steps.ver.outputs.version && format('{0}:{1}', env.IMAGE, steps.ver.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Agent 镜像:统一由 DockOrae 构建上传(Agent 仓库不跑工作流;取 Agent master 最新代码)
  build-push-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DockOrae-Agent
        uses: actions/checkout@v7
        with:
          repository: DockOrae/DockOrae-Agent
          path: agent-src
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version (git tag)
        id: ver
        run: |
          V=$(git -C agent-src describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "version=$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v7
        with:
          context: ./agent-src
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.ver.outputs.build_time }}
          tags: |
            dockorae/dockorae-agent:latest
            ${{ steps.ver.outputs.version && format('dockorae/dockorae-agent:{0}', steps.ver.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-description:
    # 更新 Docker Hub 仓库说明(overview);描述文件改动时与镜像构建并行,源码改动时幂等执行。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Docker Hub overview (full_description)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Docker Hub API: PATCH /v2/repositories/{namespace}/{name}/ {full_description}
          # 认证:先登录换 JWT(密码或 PAT 均可),再带 Authorization: JWT <token>
          jq -n --rawfile d .github/release/dockerhub-description.md '{full_description: $d}' > /tmp/desc.json
          jwt=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" | jq -r .token)
          [ -z "$jwt" ] || [ "$jwt" = "null" ] && { echo "::error::Docker Hub 登录失败,请检查 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN"; exit 1; }
          code=$(curl -sS -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: JWT $jwt" \
            --data-binary @/tmp/desc.json \
            -o /tmp/resp.json \
            -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${IMAGE}/")
          echo "HTTP $code"
          cat /tmp/resp.json
          echo
          test "$code" = "200" || { echo "::error::Docker Hub 说明更新失败(HTTP $code),请检查凭据权限"; exit 1; }
