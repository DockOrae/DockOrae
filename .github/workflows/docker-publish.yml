name: Docker Hub Publish

on:
  push:
    branches: [master]
    # 仅源码/前端/Dockerfile 改动触发构建;工作流/README 等文档改动不触发
    paths:
      - '**.go'
      - 'web/**'
      - 'Dockerfile'
  workflow_dispatch:

env:
  IMAGE: zhaoweiwen123/docker-manager-go

jobs:
  build-push:
    # git tag 是二进制发布用的(release.yml),不参与镜像构建。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version (main.go Version)
        id: ver
        run: |
          VER=$(grep -oE 'const Version = "[^"]+"' cmd/docker-manager/main.go | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          case "$VER" in
            v*) V="$VER" ;;
            "") V="" ;;
            *) V="v$VER" ;;
          esac
          echo "version=$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/s390x
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ steps.ver.outputs.version && format('{0}:{1}', env.IMAGE, steps.ver.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
