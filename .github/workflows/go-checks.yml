name: Go Checks

on:
  push:
    branches: [master]
    # 仅源码改动触发;README/workflow 等不影响 Go 代码的改动不触发
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/package.json'
      - 'web/vite.config.*'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build ./cmd/docker-manager
