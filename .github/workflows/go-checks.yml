name: Go Checks

on:
  push:
    branches: [master]
    # 仅源码改动触发;README/workflow 等不影响 Go 代码的改动不触发
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/package.json'
      - 'web/vite.config.*'
      - '.github/workflows/go-checks.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Prepare web embed placeholder
        # web/embed.go 用 go:embed all:dist 嵌入前端产物;Go 检查不需要真实 dist,
        # 但 embed 模式要求目录存在且至少一个匹配文件,否则 vet/build 报
        # "pattern all:dist: no matching files found"
        run: |
          mkdir -p web/dist
          touch web/dist/.gitkeep

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build ./cmd/docker-manager
